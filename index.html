<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="janela">
        <div id="resultado">
            <h3 id="equacao">0</h3>
            <h1 id="saida">0</h1>
        </div>
        <div id="botoes">
            <table border="1">
                <tr>
                    <td>
                        <button class="botaoControle destaque operacaoEspecial" id="btnQuadrado">x²</button>
                    </td>
                    <td> <button class="botaoControle destaque operacao" id="btnDivisao">÷</button></td>
                    <td> <button class="botaoControle destaque operacao" id="btnMultiplicacao">X</button></td>
                    <td> <button class="botaoControle destaque" id="btnApagar">⬅</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle numero" id="btn9">9</button></td>
                    <td> <button class="botaoControle numero" id="btn8">8</button></td>
                    <td> <button class="botaoControle numero" id="btn7">7</button></td>
                    <td> <button class="botaoControle destaque operacao" id="btnSoma">+</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle numero" id="btn6">6</button></td>
                    <td> <button class="botaoControle numero" id="btn5">5</button></td>
                    <td> <button class="botaoControle numero" id="btn4">4</button></td>
                    <td> <button class="botaoControle destaque operacao" id="btnSubtracao">-</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle numero" id="btn3">3</button></td>
                    <td> <button class="botaoControle numero" id="btn2">2</button></td>
                    <td> <button class="botaoControle numero" id="btn1">1</button></td>
                    <td rowspan="2"> <button class="botaoControle" id="igualdade">=</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle destaque2 operacaoEspecial" id="btnRaiz">√</button></td>
                    <td> <button class="botaoControle numero" id="btn0">0</button></td>
                    <td> <button class="botaoControle destaque2" id="virgula">.</button></td>
                </tr>
            </table>
        </div>
    </div>
</body>

<script src="script.js"></script>

</html>
