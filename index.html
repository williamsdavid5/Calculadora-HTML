<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="janela">
        <div id="resultado">
            <h3>20 + 15</h3>
            <h1>35</h1>
        </div>
        <div id="botoes">
            <table border="1">
                <tr>
                    <td>
                        <button class="botaoControle destaque">x²</button>
                    </td>
                    <td> <button class="botaoControle destaque">÷</button></td>
                    <td> <button class="botaoControle destaque">X</button></td>
                    <td> <button class="botaoControle destaque">⬅</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle">9</button></td>
                    <td> <button class="botaoControle">8</button></td>
                    <td> <button class="botaoControle">7</button></td>
                    <td> <button class="botaoControle destaque">+</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle">6</button></td>
                    <td> <button class="botaoControle">5</button></td>
                    <td> <button class="botaoControle">4</button></td>
                    <td> <button class="botaoControle destaque">-</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle">3</button></td>
                    <td> <button class="botaoControle">2</button></td>
                    <td> <button class="botaoControle">1</button></td>
                    <td rowspan="2"> <button class="botaoControle" id="igualdade">=</button></td>
                </tr>
                <tr>
                    <td> <button class="botaoControle destaque2">√</button></td>
                    <td> <button class="botaoControle">0</button></td>
                    <td> <button class="botaoControle destaque2">,</button></td>
                </tr>
            </table>
        </div>
    </div>
</body>

</html>
